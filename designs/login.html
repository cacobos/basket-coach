<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BasketFlow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@100..900&family=Work+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#1a237e",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#fa6d00",
                        "secondary-fixed-dim": "#b0c6ff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#ffdbcb",
                        "tertiary": "#331000",
                        "primary": "#000666",
                        "on-secondary-container": "#00337c",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb691",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#000767",
                        "surface": "#fbf9f8",
                        "on-secondary-fixed-variant": "#00429c",
                        "inverse-surface": "#303031",
                        "outline-variant": "#c6c5d4",
                        "on-secondary": "#ffffff",
                        "on-background": "#1b1c1c",
                        "inverse-on-surface": "#f2f0f0",
                        "surface-container-highest": "#e4e2e2",
                        "on-surface-variant": "#454652",
                        "primary-fixed": "#e0e0ff",
                        "on-primary-container": "#8690ee",
                        "surface-bright": "#fbf9f8",
                        "on-tertiary-fixed-variant": "#793100",
                        "secondary-fixed": "#d9e2ff",
                        "surface-container-high": "#e9e8e7",
                        "surface-container-low": "#f5f3f3",

                        "surface-variant": "#e4e2e2",
                        "on-primary-fixed-variant": "#343d96",
                        "on-tertiary-fixed": "#341100",
                        "error-container": "#ffdad6",
                        "surface-tint": "#4c56af",
                        "surface-container": "#efeded",
                        "secondary-container": "#759efd",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#2b5bb5",
                        "on-secondary-fixed": "#001945",
                        "on-surface": "#1b1c1c",
                        "inverse-primary": "#bdc2ff",
                        "primary-fixed-dim": "#bdc2ff",
                        "background": "#fbf9f8",
                        "outline": "#767683",
                        "tertiary-container": "#542000",
                        "surface-dim": "#dbdad9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "stack-gap": "16px",
                        "element-gap": "8px",
                        "grid-gutter": "24px",
                        "grid-margin": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Hanken Grotesk"],
                        "display-brand": ["Hanken Grotesk"],
                        "label-md": ["Work Sans"],
                        "body-md": ["Work Sans"],
                        "stats-mono": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Work Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "display-brand": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "stats-mono": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Work Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-login-gradient {
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
        }
        .login-card-shadow {
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05), 0px 8px 24px rgba(26, 35, 126, 0.1);
        }
        .input-focus-ring:focus-within {
            border-color: #2b5bb5;
            box-shadow: 0 0 0 2px rgba(43, 91, 181, 0.1);
        }
    </style>
</head>
<body class="h-full bg-login-gradient flex flex-col items-center justify-center p-grid-margin">
<!-- Login Container -->
<main class="w-full max-w-[420px] flex flex-col items-center">
<!-- Main Card -->
<div class="w-full bg-surface-container-lowest rounded-xl login-card-shadow p-container-padding">
<!-- Header Section -->
<header class="flex flex-col items-center mb-8 text-center">
<div class="flex items-center gap-element-gap mb-2">
<img alt="BasketFlow Hoop Logo" class="w-12 h-12 object-contain" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAABgCAYAAAA6lNMyAAAAq0lEQVR4AeySPQrCQBBGJ5PdmEQ2AUHFXnIIL5ALaO8NPIBNOjs9iJexCYIooljoWomVsj+ybFLoDQw78M3Aa4Z5DMJPOfAtxPlotI9JBDDrd4ZFYs7EZJCNWbc9fT9UHvXmI5RKbGJGMxZDjoF4IpGkpZX2pad9+goIhik9gwclaFWGqbjg7VBwftwu+Wm3uu4X9+qD1hLABKACZqGNA9ZD3Z2P2oSdf+zjAwAA//9xRyzmAAAABklEQVQDALclK8GSUpYJAAAAAElFTkSuQmCC"/>
<h1 class="font-display-brand text-display-brand text-primary-container">BasketFlow</h1>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Entrenamiento inteligente para tu equipo
                </p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-stack-gap" onsubmit="return false;">
<!-- Email Input -->
<div class="flex flex-col gap-1">
<div class="relative flex items-center h-[44px] border border-outline-variant rounded-lg bg-surface-container-low input-focus-ring transition-all">
<span class="material-symbols-outlined ml-3 text-on-surface-variant">mail</span>
<input class="w-full h-full bg-transparent border-none focus:ring-0 px-3 font-body-md text-on-surface placeholder:text-on-surface-variant/60" placeholder="Correo electrónico" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1">
<div class="relative flex items-center h-[44px] border border-outline-variant rounded-lg bg-surface-container-low input-focus-ring transition-all">
<span class="material-symbols-outlined ml-3 text-on-surface-variant">lock</span>
<input class="w-full h-full bg-transparent border-none focus:ring-0 px-3 font-body-md text-on-surface placeholder:text-on-surface-variant/60" placeholder="Contraseña" required="" type="password"/>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-[44px] bg-primary-container text-on-primary font-bold rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center font-headline-md text-[16px]" type="submit">
                    Iniciar sesión
                </button>
<!-- Divider -->
<div class="flex items-center gap-element-gap my-2">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="text-on-surface-variant font-label-md text-label-md">o</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Google Button -->
<button class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant text-on-surface-variant font-semibold rounded-lg hover:bg-surface-container-low transition-all flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span>Continuar con Google</span>
</button>
</form>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<a class="font-label-md text-label-md text-secondary hover:underline transition-all" href="#">
                    ¿No tienes cuenta? Regístrate
                </a>
</div>
</div>
<!-- Outside Footer -->
<footer class="mt-stack-gap text-center px-4">
<p class="font-label-md text-label-md text-surface-container-highest/60">
                © 2026 BasketFlow. Todos los derechos reservados.
            </p>
</footer>
</main>
<!-- Micro-interaction script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-secondary/20');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-secondary/20');
            });
        });
    </script>
</body></html>
